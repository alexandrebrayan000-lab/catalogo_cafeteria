<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Le Parisien - Entrar</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="icon" type="image/x-icon" href="/img/logo.png">
</head>
<body>
    <header>
        <img src="/img/logo.png" alt="logo" class="logo">
        <h1>Bv. <b>Saint-Germain</b></h1>
        <button type="button" class="btn-header">
            <a href="/index.html" title="Página Inicial">
                <img src="/img/inicio.png" alt="Início">
            </a>
        </button>
    </header>

    <nav>
        <p>Connexion &bull; Entrar na sua Conta</p>
    </nav>

    <main>
        <section class="auth-card">
            <h2>Bienvenue!</h2>
            <p class="subtitle">Acesse sua conta para fazer pedidos e acompanhar seu histórico.</p>

            <div id="feedback-login" class="mensagem-feedback"></div>

            <form id="form-login">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Entrar ☕</button>
            </form>

            <div class="auth-footer">
                <p>Não tem uma conta? <a href="/pages/cadastro.html">Cadastre-se agora</a></p>
                <div style="margin-top: 15px; display: flex; justify-content: center; gap: 15px;">
                    <a href="/pages/cardapio.html" class="btn-voltar-cardapio">☕ Ver Cardápio</a>
                    <a href="/index.html" class="btn-voltar-cardapio">🏠 Página Inicial</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 1895 Coffee Le Parisien. All rights reserved.</p>
    </footer>

    <script src="/js/script-auth.js"></script>
</body>
</html>
