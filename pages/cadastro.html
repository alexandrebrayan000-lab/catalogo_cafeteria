<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Le Parisien - Criar Conta</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <header>
        <img src="/img/logo.png" alt="logo" class="logo">
        <h1>Bv. <b>Saint-Germain</b></h1>
        <button type="button" class="btn-header">
            <a href="/index.html" title="Página Inicial">
                <img src="/img/inicio.png" alt="Início">
            </a>
        </button>
    </header>

    <nav>
        <p>Inscription &bull; Criar sua Conta</p>
    </nav>

    <main>
        <section class="auth-card">
            <h2>Créer un Compte</h2>
            <p class="subtitle">Cadastre-se para uma experiência parisiense personalizada.</p>

            <div id="feedback-cadastro" class="mensagem-feedback"></div>

            <form id="form-cadastro">
                <div class="form-group">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" name="name" placeholder="Ex: Jean Dupont" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Senha (mínimo 6 caracteres)</label>
                    <input type="password" id="password" name="password" placeholder="Crie sua senha segura" required minlength="6" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita sua senha" required minlength="6" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-submit">Criar Conta ✨</button>
            </form>

            <div class="auth-footer">
                <p>Já tem uma conta? <a href="/pages/login.html">Faça login</a></p>
                <div style="margin-top: 15px; display: flex; justify-content: center; gap: 15px;">
                    <a href="/pages/cardapio.html" class="btn-voltar-cardapio">☕ Ver Cardápio</a>
                    <a href="/index.html" class="btn-voltar-cardapio">🏠 Página Inicial</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 1895 Coffee Le Parisien. All rights reserved.</p>
    </footer>

    <script src="/js/script-auth.js"></script>
</body>
</html>
